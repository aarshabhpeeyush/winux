<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Light World</title>
<style>
  html, body { margin: 0; height: 100%; background: #8fd0ff; overflow: hidden; }
  canvas { width: 100vw; height: 100vh; display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Light World: a sunny little hometown. Clouds drift, birds fly by,
// chimneys puff, and the trees sway a bit.
const PIXEL = 4;
const opts = { sky: "#8fd0ff", speed: 1, birds: true };

const c = document.getElementById("c");
const ctx = c.getContext("2d");
let W, H, S, clouds = [], houses = [], trees = [], birds = [], puffs = [];

const R = (x, y, w, h, col) => { ctx.fillStyle = col; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
function ellipse(cx, cy, rx, ry, col) {
  ctx.fillStyle = col;
  for (let y = -ry; y <= ry; y++) {
    const half = Math.round(rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry))));
    ctx.fillRect(Math.round(cx - half), Math.round(cy + y), half * 2 + 1, 1);
  }
}
function poly(pts, col) {
  ctx.fillStyle = col;
  ctx.beginPath();
  pts.forEach(([x, y], i) => (i ? ctx.lineTo(Math.round(x), Math.round(y)) : ctx.moveTo(Math.round(x), Math.round(y))));
  ctx.closePath();
  ctx.fill();
}
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (a) => a[Math.floor(Math.random() * a.length)];

function resize() {
  W = c.width = Math.ceil(innerWidth / PIXEL);
  H = c.height = Math.ceil(innerHeight / PIXEL);
  S = Math.max(1, Math.round(H / 270));
  clouds = Array.from({ length: 7 }, () => ({ x: rnd(0, W), y: rnd(H * 0.06, H * 0.35), w: rnd(18, 40), v: rnd(2, 5) }));
  const ground = H * 0.78;
  houses = [];
  let x = 4;
  while (x < W - 20) {
    const w = Math.round(rnd(22, 34)), h = Math.round(rnd(16, 24));
    houses.push({ x, w, h, y: ground, wall: pick(["#f3e2c3", "#e9d3b0", "#dfe7f0", "#f5d6c6"]),
                  roof: pick(["#c0473c", "#3f6fb5", "#7a4b32", "#4f8a5b"]), chimney: Math.random() < 0.6 });
    x += w + Math.round(rnd(14, 34));
  }
  trees = Array.from({ length: Math.round(W / 22) }, () => ({ x: rnd(0, W), r: rnd(6, 10), p: rnd(0, 6) }));
  birds = [];
  puffs = [];
}
addEventListener("resize", resize);
resize();

function cloud(x, y, w) {
  ellipse(x, y, w * 0.5, w * 0.18, "#ffffff");
  ellipse(x - w * 0.22, y - w * 0.08, w * 0.22, w * 0.16, "#ffffff");
  ellipse(x + w * 0.12, y - w * 0.14, w * 0.26, w * 0.2, "#ffffff");
  R(x - w * 0.5, y + w * 0.1, w, 2, "#e4f2ff");
}

let last = performance.now(), t = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000) * opts.speed;
  last = now;
  t += dt;

  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, opts.sky);
  sky.addColorStop(0.75, "#dff3ff");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // sun with a slow shimmer
  const sx = W * 0.82, sy = H * 0.16, sr = Math.round(H * 0.07);
  ctx.globalAlpha = 0.25 + 0.05 * Math.sin(t * 2);
  ellipse(sx, sy, sr + 6, sr + 6, "#fff3b0");
  ctx.globalAlpha = 1;
  ellipse(sx, sy, sr, sr, "#ffe066");

  for (const cl of clouds) {
    cl.x += cl.v * dt;
    if (cl.x - cl.w > W) { cl.x = -cl.w; cl.y = rnd(H * 0.06, H * 0.35); }
    cloud(cl.x, cl.y, cl.w);
  }

  // hills
  ctx.fillStyle = "#9cc9a8";
  for (let x = 0; x < W; x++) ctx.fillRect(x, Math.round(H * 0.62 - Math.sin(x / W * 4 + 1) * H * 0.06), 1, H);
  ctx.fillStyle = "#7db88a";
  for (let x = 0; x < W; x++) ctx.fillRect(x, Math.round(H * 0.7 - Math.sin(x / W * 6 + 3) * H * 0.03), 1, H);

  // trees behind the houses
  for (const tr of trees) {
    const sway = Math.round(Math.sin(t * 1.2 + tr.p) * 1);
    R(tr.x - 1, H * 0.78 - tr.r * 1.6, 2, tr.r * 1.6, "#6b4a32");
    ellipse(tr.x + sway, H * 0.78 - tr.r * 1.9, tr.r, tr.r, "#4f9a5a");
    ellipse(tr.x + sway - 2, H * 0.78 - tr.r * 2.1, tr.r * 0.6, tr.r * 0.5, "#6cb873");
  }

  // houses
  for (const hs of houses) {
    const top = hs.y - hs.h;
    R(hs.x, top, hs.w, hs.h, hs.wall);
    poly([[hs.x - 3, top + 1], [hs.x + hs.w / 2, top - hs.h * 0.6], [hs.x + hs.w + 3, top + 1]], hs.roof);
    R(hs.x + hs.w / 2 - 3, hs.y - 9, 6, 9, "#6b4a32");                      // door
    R(hs.x + 3, top + 5, 6, 5, "#9fd6ff"); R(hs.x + hs.w - 9, top + 5, 6, 5, "#9fd6ff");
    R(hs.x + 5, top + 5, 1, 5, "#ffffff"); R(hs.x + hs.w - 7, top + 5, 1, 5, "#ffffff");
    if (hs.chimney) {
      R(hs.x + hs.w * 0.72, top - hs.h * 0.45, 4, 8, "#8c5a44");
      if (Math.random() < 0.03 * opts.speed) puffs.push({ x: hs.x + hs.w * 0.72 + 2, y: top - hs.h * 0.45 - 2, a: 0.8 });
    }
  }
  for (const p of puffs) {
    p.y -= 6 * dt; p.x += 3 * dt; p.a -= 0.25 * dt;
    ctx.globalAlpha = Math.max(0, p.a);
    ellipse(p.x, p.y, 2, 2, "#ffffff");
  }
  puffs = puffs.filter((p) => p.a > 0);
  ctx.globalAlpha = 1;

  // road, grass edge, fence
  R(0, H * 0.78, W, 3, "#5f9a5f");
  R(0, H * 0.78 + 3, W, H, "#7d7f86");
  for (let x = (-(t * 0) % 18); x < W; x += 18) R(x, H * 0.88, 9, 1, "#e9e9e9");
  R(0, H * 0.96, W, H, "#5f9a5f");

  // birds
  if (opts.birds) {
    if (Math.random() < 0.004 * opts.speed) {
      const y = rnd(H * 0.1, H * 0.4);
      for (let i = 0; i < 3; i++) birds.push({ x: -10 - i * 8, y: y + (i % 2) * 4, p: rnd(0, 6) });
    }
    for (const b of birds) {
      b.x += 18 * dt;
      const flap = Math.sin(t * 10 + b.p) > 0 ? 1 : 0;
      ctx.fillStyle = "#3a3a4a";
      ctx.fillRect(Math.round(b.x), Math.round(b.y), 1, 1);
      ctx.fillRect(Math.round(b.x) - 1, Math.round(b.y) - flap, 1, 1);
      ctx.fillRect(Math.round(b.x) + 1, Math.round(b.y) - flap, 1, 1);
      ctx.fillRect(Math.round(b.x) - 2, Math.round(b.y) - flap * 2, 1, 1);
      ctx.fillRect(Math.round(b.x) + 2, Math.round(b.y) - flap * 2, 1, 1);
    }
    birds = birds.filter((b) => b.x < W + 10);
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function livelyPropertyListener(name, val) {
  if (name in opts) opts[name] = val;
}
</script>
</body>
</html>
