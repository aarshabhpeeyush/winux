<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Dark World</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { width: 100vw; height: 100vh; display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Dark World: pixel stars twinkling around a dark fountain whose light rises forever.
const PIXEL = 4;                 // each "pixel" is 4 real pixels: chunky retro look
const opts = { accent: "#ffe600", speed: 1, soul: true };

const c = document.getElementById("c");
const ctx = c.getContext("2d");
let W, H, stars = [], motes = [];

function resize() {
  W = c.width = Math.ceil(innerWidth / PIXEL);
  H = c.height = Math.ceil(innerHeight / PIXEL);
  stars = Array.from({ length: Math.round(W * H / 260) }, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    layer: 1 + Math.floor(Math.random() * 3),
    phase: Math.random() * Math.PI * 2,
    big: Math.random() < 0.06,
  }));
  motes = [];
}
addEventListener("resize", resize);
resize();

function hexRgb(h) {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

// 4-point sparkle, same shape as the WinUx box corners.
function sparkle(x, y, a) {
  ctx.globalAlpha = a;
  ctx.fillRect(x, y, 1, 1);
  if (a > 0.6) {
    ctx.globalAlpha = a * 0.6;
    ctx.fillRect(x - 1, y, 1, 1); ctx.fillRect(x + 1, y, 1, 1);
    ctx.fillRect(x, y - 1, 1, 1); ctx.fillRect(x, y + 1, 1, 1);
  }
  if (a > 0.85) {
    ctx.globalAlpha = a * 0.3;
    ctx.fillRect(x - 2, y, 1, 1); ctx.fillRect(x + 2, y, 1, 1);
    ctx.fillRect(x, y - 2, 1, 1); ctx.fillRect(x, y + 2, 1, 1);
  }
}

// The red soul heart, 7x6 pixels.
const HEART = ["0110110", "1111111", "1111111", "0111110", "0011100", "0001000"];
function heart(x, y) {
  ctx.fillStyle = "#ff1a1a";
  HEART.forEach((row, j) => [...row].forEach((p, i) => p === "1" && ctx.fillRect(x + i, y + j, 1, 1)));
}

let last = performance.now(), t = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000) * opts.speed;
  last = now;
  t += dt;
  const [ar, ag, ab] = hexRgb(opts.accent);
  const cx = W / 2;

  ctx.globalAlpha = 1;
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);

  // stars drift slowly left, nearer layers faster
  ctx.fillStyle = "#fff";
  for (const s of stars) {
    s.x -= s.layer * 0.6 * dt;
    if (s.x < -3) { s.x = W + 3; s.y = Math.random() * H; }
    const tw = 0.5 + 0.5 * Math.sin(t * (1 + s.layer * 0.4) + s.phase);
    const a = (0.15 + s.layer * 0.18) * (0.35 + 0.65 * tw);
    if (s.big) sparkle(Math.round(s.x), Math.round(s.y), Math.min(1, a + 0.35 * tw));
    else { ctx.globalAlpha = a; ctx.fillRect(Math.round(s.x), Math.round(s.y), 1, 1); }
  }

  // the fountain: a pillar of black with a soft glowing edge
  const fw = Math.max(10, Math.round(W * 0.035));
  const glow = ctx.createLinearGradient(cx - fw * 3, 0, cx + fw * 3, 0);
  glow.addColorStop(0, "rgba(255,255,255,0)");
  glow.addColorStop(0.5, `rgba(${ar},${ag},${ab},${0.10 + 0.04 * Math.sin(t * 1.3)})`);
  glow.addColorStop(1, "rgba(255,255,255,0)");
  ctx.globalAlpha = 1;
  ctx.fillStyle = glow;
  ctx.fillRect(cx - fw * 3, 0, fw * 6, H);
  ctx.fillStyle = "#000";
  ctx.fillRect(Math.round(cx - fw / 2), 0, fw, H);
  ctx.fillStyle = "#fff";
  ctx.globalAlpha = 0.85;
  ctx.fillRect(Math.round(cx - fw / 2) - 1, 0, 1, H);
  ctx.fillRect(Math.round(cx + fw / 2), 0, 1, H);

  // light motes rising out of the fountain
  if (Math.random() < 0.9 * opts.speed) {
    motes.push({ x: cx + (Math.random() - 0.5) * fw * 2.2, y: H + 2,
                 v: 6 + Math.random() * 14, wob: Math.random() * 6, col: Math.random() < 0.3 });
  }
  for (const m of motes) {
    m.y -= m.v * dt;
    const x = Math.round(m.x + Math.sin(t * 2 + m.wob) * 1.5);
    ctx.globalAlpha = Math.max(0, Math.min(1, m.y / H)) * 0.9;
    ctx.fillStyle = m.col ? opts.accent : "#fff";
    ctx.fillRect(x, Math.round(m.y), 1, 1);
  }
  motes = motes.filter((m) => m.y > -2);

  // ground glow line
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = opts.accent;
  ctx.fillRect(0, H - 1, W, 1);

  // a soul floats gently near the bottom
  if (opts.soul) {
    ctx.globalAlpha = 1;
    heart(Math.round(cx - 3), Math.round(H * 0.78 + Math.sin(t * 1.6) * 2));
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Lively calls this when you change settings in its Customize panel.
function livelyPropertyListener(name, val) {
  if (name in opts) opts[name] = val;
}
</script>
</body>
</html>
