<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Field of Hopes</title>
<style>
  html, body { margin: 0; height: 100%; background: #140f2b; overflow: hidden; }
  canvas { width: 100vw; height: 100vh; display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Field of Hopes: Ralsei resting in a field of green grass under a Dark World sky,
// with a small yellow flower nearby. The grass sways and fireflies drift.
const PIXEL = 4;
const opts = { grass: "#2fbf71", speed: 1, fireflies: true };

const c = document.getElementById("c");
const ctx = c.getContext("2d");
let W, H, S, blades = [], stars = [], flies = [];

const R = (x, y, w, h, col) => { ctx.fillStyle = col; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
function ellipse(cx, cy, rx, ry, col) {
  ctx.fillStyle = col;
  for (let y = -ry; y <= ry; y++) {
    const half = Math.round(rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry))));
    ctx.fillRect(Math.round(cx - half), Math.round(cy + y), half * 2 + 1, 1);
  }
}
function poly(pts, col) {
  ctx.fillStyle = col;
  ctx.beginPath();
  pts.forEach(([x, y], i) => (i ? ctx.lineTo(Math.round(x), Math.round(y)) : ctx.moveTo(Math.round(x), Math.round(y))));
  ctx.closePath();
  ctx.fill();
}
const hexRgb = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const shade = (h, k) => { const [r, g, b] = hexRgb(h); return `rgb(${Math.round(r * k)},${Math.round(g * k)},${Math.round(b * k)})`; };

function resize() {
  W = c.width = Math.ceil(innerWidth / PIXEL);
  H = c.height = Math.ceil(innerHeight / PIXEL);
  S = Math.max(1, Math.round(H / 270));
  stars = Array.from({ length: Math.round(W * H / 350) }, () => ({ x: Math.random() * W, y: Math.random() * H * 0.5, p: Math.random() * 6 }));
  // grass blades from back (small, dark) to front (tall, bright)
  blades = [];
  const top = H * 0.62;
  for (let i = 0; i < W * 3.2; i++) {
    const depth = Math.random();
    blades.push({ x: Math.random() * W, y: top + depth * (H - top) + 2, h: 3 + depth * 9 * S,
                  k: 0.45 + depth * 0.6, p: Math.random() * 6 });
  }
  blades.sort((a, b) => a.y - b.y);
  flies = Array.from({ length: 18 }, () => ({ x: Math.random() * W, y: H * (0.45 + Math.random() * 0.4), p: Math.random() * 6 }));
}
addEventListener("resize", resize);
resize();

// Ralsei sitting, centered at (x, y) = his seat. s = pixel size.
function ralsei(x, y, s, t) {
  const breathe = Math.round(Math.sin(t * 1.6) * 0.6 * s);
  const robe = "#1f7a4a", robeDark = "#145534", robeLight = "#2c9a5f";
  // legs/robe spread on the grass
  ellipse(x, y, 22 * s, 6 * s, robeDark);
  // feet poking out
  ellipse(x - 14 * s, y + 3 * s, 4 * s, 3 * s, "#3d2a1e");
  ellipse(x + 14 * s, y + 3 * s, 4 * s, 3 * s, "#3d2a1e");
  // body (robe)
  poly([[x - 16 * s, y], [x - 11 * s, y - 26 * s + breathe], [x + 11 * s, y - 26 * s + breathe], [x + 16 * s, y]], robe);
  poly([[x - 3 * s, y - 24 * s + breathe], [x + 3 * s, y - 24 * s + breathe], [x + 4 * s, y], [x - 4 * s, y]], robeLight);
  // arms resting on his lap
  ellipse(x - 12 * s, y - 10 * s, 5 * s, 9 * s, robe);
  ellipse(x + 12 * s, y - 10 * s, 5 * s, 9 * s, robe);
  ellipse(x - 7 * s, y - 4 * s, 4 * s, 3 * s, "#ffffff");   // fluffy hands
  ellipse(x + 7 * s, y - 4 * s, 4 * s, 3 * s, "#ffffff");
  // pink scarf
  ellipse(x, y - 26 * s + breathe, 12 * s, 4 * s, "#e0568f");
  poly([[x + 6 * s, y - 26 * s + breathe], [x + 11 * s, y - 25 * s + breathe], [x + 9 * s, y - 12 * s + breathe], [x + 5 * s, y - 13 * s + breathe]], "#c94a7e");
  // head, drawn like the plush: floppy ears, round green glasses, blush, "w" smile
  const hy = y - 38 * s + breathe;
  // long floppy ears hanging down beside his face (behind the head)
  ellipse(x - 14 * s, hy + 4 * s, 4 * s, 9 * s, "#dcdcd6");
  ellipse(x + 14 * s, hy + 4 * s, 4 * s, 9 * s, "#dcdcd6");
  ellipse(x - 14 * s, hy + 3 * s, 3 * s, 8 * s, "#ffffff");
  ellipse(x + 14 * s, hy + 3 * s, 3 * s, 8 * s, "#ffffff");
  // round fluffy head + snout
  ellipse(x, hy, 13 * s, 12 * s, "#e3e3dd");
  ellipse(x, hy - 1 * s, 12 * s, 11 * s, "#ffffff");
  ellipse(x, hy + 7 * s, 5 * s, 3 * s, "#f3f3ee");
  // little arched eyebrows
  R(x - 6 * s, hy - 5 * s, 3 * s, s, "#222");
  R(x + 3 * s, hy - 5 * s, 3 * s, s, "#222");
  // big oval eyes (blink now and then)
  const blink = (t % 5) < 0.12;
  for (const ex of [-4, 4]) {
    if (blink) R(x + ex * s - s, hy + 1 * s, 3 * s, s, "#111");
    else { R(x + ex * s - s, hy - 1 * s, 2 * s, 4 * s, "#111"); R(x + ex * s - s, hy - 1 * s, s, s, "#666"); }
  }
  // round green glasses
  ctx.fillStyle = "#2fbf8f";
  for (const gx of [-4, 4]) {
    for (let a = 0; a < 40; a++) {
      const ang = a / 40 * Math.PI * 2;
      ctx.fillRect(Math.round(x + gx * s + Math.cos(ang) * 4 * s), Math.round(hy + 1 * s + Math.sin(ang) * 4 * s), s, s);
    }
  }
  // pink blush
  R(x - 9 * s, hy + 5 * s, 2 * s, s, "#ff9cba");
  R(x + 7 * s, hy + 5 * s, 2 * s, s, "#ff9cba");
  // nose + "w" smile
  R(x - 1 * s, hy + 6 * s, 2 * s, s, "#333");
  for (const [mx, my] of [[-3, 8], [-2, 9], [-1, 9], [0, 8], [1, 9], [2, 9], [3, 8]]) R(x + mx * s, hy + my * s, s, s, "#333");
  // the big green wizard hat with a floppy tip (sits above the glasses)
  const hb = hy - 11 * s;
  // pink horn tips peeking out under the brim
  R(x - 11 * s, hb + 2 * s, 2 * s, 2 * s, "#ffb3c7");
  R(x + 9 * s, hb + 2 * s, 2 * s, 2 * s, "#ffb3c7");
  ellipse(x, hb, 20 * s, 4 * s, "#123d27");
  poly([[x - 12 * s, hb - 1 * s], [x - 6 * s, hb - 23 * s], [x + 2 * s, hb - 33 * s], [x + 12 * s, hb - 1 * s]], "#1b5c39");
  poly([[x + 2 * s, hb - 33 * s], [x + 12 * s, hb - 36 * s], [x + 15 * s, hb - 31 * s], [x + 3 * s, hb - 28 * s]], "#1b5c39");
  poly([[x - 7 * s, hb - 3 * s], [x - 3 * s, hb - 23 * s], [x, hb - 23 * s], [x - 3 * s, hb - 3 * s]], "#26794d");
  R(x - 12 * s, hb - 4 * s, 24 * s, 2 * s, "#123d27");
}

// A small yellow flower with a face - a quiet nod to Flowey.
function flower(x, y, s, t) {
  const sway = Math.round(Math.sin(t * 1.3) * 1.5 * s);
  ctx.fillStyle = "#2e8b46";
  for (let i = 0; i < 9 * s; i++) ctx.fillRect(Math.round(x + sway * (i / (9 * s))), Math.round(y - i), s, 1);
  ellipse(x - 3 * s, y - 3 * s, 3 * s, 1 * s, "#2e8b46");   // leaf
  const fx = x + sway, fy = y - 10 * s;
  for (let a = 0; a < 5; a++) {
    const ang = a / 5 * Math.PI * 2 - Math.PI / 2;
    ellipse(fx + Math.cos(ang) * 4 * s, fy + Math.sin(ang) * 4 * s, 2.4 * s, 2.4 * s, "#ffd23a");
  }
  ellipse(fx, fy, 3 * s, 3 * s, "#fff6dc");
  R(fx - 2 * s, fy - 1 * s, s, s, "#222");
  R(fx + 1 * s, fy - 1 * s, s, s, "#222");
  R(fx - 1 * s, fy + 1 * s, 2 * s, s, "#222");
}

let last = performance.now(), t = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000) * opts.speed;
  last = now;
  t += dt;

  // Dark World twilight sky
  const sky = ctx.createLinearGradient(0, 0, 0, H * 0.7);
  sky.addColorStop(0, "#0e0a24");
  sky.addColorStop(0.6, "#2a1d4f");
  sky.addColorStop(1, "#4b2e6b");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);
  for (const s of stars) {
    ctx.globalAlpha = 0.25 + 0.45 * (0.5 + 0.5 * Math.sin(t * 1.4 + s.p));
    R(s.x, s.y, 1, 1, "#fff");
  }
  ctx.globalAlpha = 1;

  // far hills
  ctx.fillStyle = shade(opts.grass, 0.32);
  for (let x = 0; x < W; x++) {
    const h = H * 0.6 - Math.sin(x / W * 5 + 1) * H * 0.05 - Math.sin(x / W * 13) * H * 0.015;
    ctx.fillRect(x, Math.round(h), 1, H);
  }
  ctx.fillStyle = shade(opts.grass, 0.5);
  for (let x = 0; x < W; x++) {
    const h = H * 0.64 - Math.sin(x / W * 3 + 4) * H * 0.03;
    ctx.fillRect(x, Math.round(h), 1, H);
  }
  R(0, H * 0.66, W, H, shade(opts.grass, 0.62));

  // grass blades behind Ralsei, then Ralsei and the flower, then grass in front
  const rx = Math.round(W * 0.42), ry = Math.round(H * 0.8);
  const drawBlades = (front) => {
    for (const b of blades) {
      if ((b.y > ry) !== front) continue;
      // keep the grass right in front of Ralsei and the flower short, so we can see them
      const nearby = front && b.x > rx - 26 * S && b.x < rx + 46 * S && b.y < ry + 14 * S;
      const h = nearby ? Math.min(b.h, 2) : b.h;
      const sway = Math.sin(t * 1.8 + b.x * 0.05 + b.p * 0.3) * h * 0.25;
      ctx.fillStyle = shade(opts.grass, b.k);
      for (let i = 0; i < h; i++) ctx.fillRect(Math.round(b.x + sway * (i / h)), Math.round(b.y - i), 1, 1);
    }
  };
  drawBlades(false);
  ralsei(rx, ry, S, t);
  flower(Math.round(rx + 38 * S), Math.round(ry + 4 * S), S, t);
  drawBlades(true);

  if (opts.fireflies) {
    for (const f of flies) {
      f.x += Math.sin(t * 0.7 + f.p) * 3 * dt;
      f.y += Math.cos(t * 0.5 + f.p * 2) * 2 * dt;
      ctx.globalAlpha = 0.4 + 0.6 * Math.max(0, Math.sin(t * 2 + f.p * 3));
      R(f.x, f.y, 1, 1, "#fff6a0");
    }
    ctx.globalAlpha = 1;
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function livelyPropertyListener(name, val) {
  if (name in opts) opts[name] = val;
}
</script>
</body>
</html>
