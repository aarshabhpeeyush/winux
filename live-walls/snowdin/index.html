<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Snowdin</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a1430; overflow: hidden; }
  canvas { width: 100vw; height: 100vh; display: block; image-rendering: pixelated; }
  #music { position: fixed; width: 1px; height: 1px; left: -10px; top: -10px; border: 0; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// tell WinUx (for achievements); does nothing if WinUx isn't running
function winuxEvent(e) {
  if (location.search.includes("snapshot")) return;
  try { fetch("http://127.0.0.1:7777/event?e=" + e, { mode: "no-cors" }).catch(() => {}); } catch { /* fine */ }
}
// Snowdin: a snowy night in town. Pine trees, cozy houses with warm windows,
// blinking string lights, a snowman, and snow that never stops.
// Plays the Snowdin Town music.
const PIXEL = 4;
const opts = { snow: 1, speed: 1, music: true, volume: 50 };
const SONG = "vYyLL9QstbI";   // "Snowdin Town" - Toby Fox

const c = document.getElementById("c");
const ctx = c.getContext("2d");
let W, H, S, flakes = [], stars = [], pines = [], houses = [];

const R = (x, y, w, h, col) => { ctx.fillStyle = col; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
function ellipse(cx, cy, rx, ry, col) {
  ctx.fillStyle = col;
  for (let y = -ry; y <= ry; y++) {
    const half = Math.round(rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry))));
    ctx.fillRect(Math.round(cx - half), Math.round(cy + y), half * 2 + 1, 1);
  }
}
function poly(pts, col) {
  ctx.fillStyle = col;
  ctx.beginPath();
  pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
  ctx.closePath();
  ctx.fill();
}
const rnd = (a, b) => a + Math.random() * (b - a);

function resize() {
  W = c.width = Math.ceil(innerWidth / PIXEL);
  H = c.height = Math.ceil(innerHeight / PIXEL);
  S = Math.max(1, Math.round(H / 270));
  stars = Array.from({ length: Math.round(W * H / 600) }, () => ({ x: rnd(0, W), y: rnd(0, H * 0.5), p: rnd(0, 6) }));
  flakes = Array.from({ length: 600 }, () => newFlake(true));
  pines = [];
  for (let layer = 0; layer < 2; layer++)
    for (let x = rnd(-10, 0); x < W + 20; x += rnd(10, 22) * (layer ? 1.3 : 1))
      pines.push({ x, layer, h: rnd(40, 80) * (layer ? 1.2 : 0.8) * S / 2 });
  houses = [
    { x: W * 0.1, w: 70 * S, h: 40 * S, roof: "#3a5a8a", wall: "#6a4a3a", name: "SHOP" },
    { x: W * 0.38, w: 90 * S, h: 48 * S, roof: "#5a3a6a", wall: "#7a5a3a", name: "GRILLBY'S" },
    { x: W * 0.66, w: 80 * S, h: 44 * S, roof: "#2a6a5a", wall: "#5a4030", name: "" },
  ];
}
function newFlake(anywhere) {
  const z = Math.random();
  return { x: rnd(0, W), y: anywhere ? rnd(0, H) : -2, z, v: 6 + z * 18, p: rnd(0, 6) };
}
addEventListener("resize", resize);
resize();

function pine(x, base, h, dark) {
  const body = dark ? "#0c2a2a" : "#14403a", snow = dark ? "#a8c0d8" : "#e8f2ff";
  R(x - 1, base - h * 0.15, 3, h * 0.15, "#2a1a10");
  for (let k = 0; k < 3; k++) {
    const ty = base - h * 0.15 - k * h * 0.27, w = h * (0.42 - k * 0.1);
    poly([[x - w, ty], [x + w + 1, ty], [x + 0.5, ty - h * 0.4]], body);
    poly([[x - w * 0.35, ty - h * 0.25], [x + w * 0.35 + 1, ty - h * 0.25], [x + 0.5, ty - h * 0.4]], snow);
  }
}

let last = performance.now(), t = 0;
function frame(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)) * opts.speed;
  last = Math.max(last, now);
  t += dt;

  // night sky
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#050a20");
  sky.addColorStop(0.6, "#14285a");
  sky.addColorStop(1, "#2a4a80");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);
  for (const s of stars) {
    ctx.globalAlpha = 0.25 + 0.5 * (0.5 + 0.5 * Math.sin(t * 1.5 + s.p));
    R(s.x, s.y, 1, 1, "#dfe8ff");
  }
  ctx.globalAlpha = 1;

  const groundY = Math.round(H * 0.72);
  // back row of pines
  for (const p of pines) if (p.layer === 0) pine(p.x, groundY - 6 * S, p.h, true);
  // snowy hills
  R(0, groundY, W, H - groundY, "#dce8f8");
  for (let x = 0; x < W; x++) R(x, groundY - Math.round(Math.sin(x * 0.03) * 2 + 2), 1, 5, "#dce8f8");

  // houses with glowing windows and snow on the roof
  for (const h of houses) {
    const top = groundY - h.h;
    R(h.x, top, h.w, h.h, h.wall);
    for (let y = top + 3; y < groundY; y += 4) R(h.x, y, h.w, 1, "rgba(0,0,0,0.15)");
    poly([[h.x - 6 * S, top + 1], [h.x + h.w + 6 * S, top + 1], [h.x + h.w / 2, top - h.h * 0.6]], h.roof);
    poly([[h.x - 6 * S, top + 1], [h.x + h.w + 6 * S, top + 1], [h.x + h.w + 4 * S, top - 2 * S], [h.x - 4 * S, top - 2 * S]], "#f0f6ff");
    poly([[h.x + h.w / 2 - 8 * S, top - h.h * 0.5], [h.x + h.w / 2 + 8 * S, top - h.h * 0.5], [h.x + h.w / 2, top - h.h * 0.62]], "#f0f6ff");
    // windows flicker warm like a fireplace
    for (const fx of [0.2, 0.68]) {
      const flick = 0.85 + 0.15 * Math.sin(t * 7 + fx * 10 + h.x);
      const wx = h.x + h.w * fx, wy = top + h.h * 0.25, ww = h.w * 0.14, wh = h.h * 0.3;
      ctx.globalAlpha = 0.3 * flick;
      R(wx - 3 * S, wy - 3 * S, ww + 6 * S, wh + 6 * S, "#ffb040");
      ctx.globalAlpha = 1;
      R(wx, wy, ww, wh, `rgb(255,${Math.round(190 * flick)},${Math.round(80 * flick)})`);
      R(wx + ww / 2, wy, 1, wh, h.wall);
      R(wx, wy + wh / 2, ww, 1, h.wall);
    }
    R(h.x + h.w * 0.43, groundY - h.h * 0.5, h.w * 0.14, h.h * 0.5, "#3a2418");   // door
    // sign
    if (h.name) {
      ctx.font = `${6 * S}px monospace`;
      ctx.textAlign = "center";
      ctx.fillStyle = "#ffe8a0";
      ctx.fillText(h.name, h.x + h.w / 2, top - h.h * 0.62 - 3 * S);
    }
  }

  // string lights across the town, blinking in colors
  const cols = ["#ff4040", "#40ff70", "#4090ff", "#ffe040"];
  for (let span = 0; span < 3; span++) {
    const x0 = W * (0.05 + span * 0.32), x1 = x0 + W * 0.3, y0 = groundY - 70 * S;
    ctx.globalAlpha = 0.6;
    for (let x = x0; x < x1; x++) R(x, y0 + Math.sin(((x - x0) / (x1 - x0)) * Math.PI) * 10 * S, 1, 1, "#1a1a2a");
    ctx.globalAlpha = 1;
    let k = 0;
    for (let x = x0 + 4 * S; x < x1; x += 7 * S, k++) {
      const y = y0 + Math.sin(((x - x0) / (x1 - x0)) * Math.PI) * 10 * S + 1;
      const on = Math.sin(t * 2 + k * 1.3 + span) > -0.4;
      const col = cols[(k + span) % 4];
      if (on) { ctx.globalAlpha = 0.3; R(x - 2 * S, y - 1 * S, 4 * S, 4 * S, col); ctx.globalAlpha = 1; }
      R(x - S / 2, y, S + 1, 2 * S, on ? col : "#2a2a3a");
    }
  }

  // front row of pines
  for (const p of pines) if (p.layer === 1 && (p.x < W * 0.08 || p.x > W * 0.9)) pine(p.x, H + 2, p.h * 1.6, false);

  // snowman with a little scarf
  const sx = W * 0.8, sy = groundY + 18 * S;
  ellipse(sx, sy, 9 * S, 8 * S, "#f4f8ff");
  ellipse(sx, sy - 12 * S, 6 * S, 6 * S, "#f4f8ff");
  R(sx - 6 * S, sy - 8 * S, 12 * S, 2 * S, "#d82a3a");
  R(sx + 2 * S, sy - 8 * S, 2 * S, 6 * S, "#d82a3a");
  R(sx - 2 * S, sy - 14 * S, S, S, "#111");
  R(sx + 2 * S, sy - 14 * S, S, S, "#111");
  R(sx, sy - 12 * S, 4 * S, S, "#ff8a20");
  for (let k = 0; k < 3; k++) R(sx - S / 2, sy - 3 * S + k * 3 * S, S, S, "#222");

  // snowfall
  const count = Math.round(200 * opts.snow);
  for (let n = 0; n < Math.min(count, flakes.length); n++) {
    const f = flakes[n];
    f.y += f.v * dt;
    f.x += Math.sin(t + f.p) * 5 * dt;
    if (f.y > H) Object.assign(f, newFlake(false));
    ctx.globalAlpha = 0.5 + f.z * 0.5;
    R(f.x, f.y, f.z > 0.7 ? 2 : 1, f.z > 0.7 ? 2 : 1, "#ffffff");
  }
  ctx.globalAlpha = 1;

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- music ----------------------------------------------------------------
// If you drop your own copy of the song next to this file as music.mp3, that
// plays. Otherwise WinUx streams it from YouTube (WinUx needs to be running).
// The theme previews inside the WinUx panel stay silent.
let audio = null, player = null;
const isWallpaper = window.top === window;
function startMusic() {
  if (!isWallpaper || audio || player) return;
  const a = new Audio("music.mp3");
  a.loop = true;
  a.volume = opts.volume / 100;
  a.addEventListener("canplay", () => { audio = a; if (opts.music) a.play().catch(() => {}); }, { once: true });
  a.addEventListener("error", () => {
    player = document.createElement("iframe");
    player.id = "music";
    player.allow = "autoplay";
    player.src = `http://127.0.0.1:7777/music?v=${SONG}&vol=${opts.volume}&on=${opts.music ? 1 : 0}`;
    document.body.appendChild(player);
  }, { once: true });
  a.load();
}
function updateMusic() {
  if (audio) {
    audio.volume = opts.volume / 100;
    if (opts.music) audio.play().catch(() => {}); else audio.pause();
  }
  if (player) player.contentWindow.postMessage({ winuxMusic: true, on: opts.music, vol: opts.volume }, "*");
  if (opts.music && opts.volume > 0) winuxEvent("music");
}
startMusic();

function livelyPropertyListener(name, val) {
  if (name in opts) opts[name] = val;
  if (name === "music" || name === "volume") updateMusic();
}
</script>
</body>
</html>
