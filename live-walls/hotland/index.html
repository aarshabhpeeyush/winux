<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Hotland</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a0602; overflow: hidden; }
  canvas { width: 100vw; height: 100vh; display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Hotland + CORE: red rock, glowing magma, steam vents puffing, pipes,
// and the CORE in the distance with its heart pulsing orange.
const PIXEL = 4;
const opts = { speed: 1, steam: true };

const c = document.getElementById("c");
const ctx = c.getContext("2d");
let W, H, S, steam = [], embers = [], vents = [];

const R = (x, y, w, h, col) => { ctx.fillStyle = col; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
function ellipse(cx, cy, rx, ry, col) {
  ctx.fillStyle = col;
  for (let y = -ry; y <= ry; y++) {
    const half = Math.round(rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry))));
    ctx.fillRect(Math.round(cx - half), Math.round(cy + y), half * 2 + 1, 1);
  }
}
function poly(pts, col) {
  ctx.fillStyle = col;
  ctx.beginPath();
  pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
  ctx.closePath();
  ctx.fill();
}
const rnd = (a, b) => a + Math.random() * (b - a);

function resize() {
  W = c.width = Math.ceil(innerWidth / PIXEL);
  H = c.height = Math.ceil(innerHeight / PIXEL);
  S = Math.max(1, Math.round(H / 270));
  vents = [0.12, 0.3, 0.7, 0.88].map((f) => ({ x: W * f, t: rnd(0, 3) }));
  steam = [];
  embers = Array.from({ length: 70 }, () => newEmber(true));
}
function newEmber(anywhere) {
  return { x: rnd(0, W), y: anywhere ? rnd(0, H) : H + 2, v: rnd(6, 18), p: rnd(0, 6) };
}
addEventListener("resize", resize);
resize();

function core(cx, base, t) {
  // the CORE: a huge dark tower with glowing seams and a pulsing heart
  const w = 70 * S, h = H * 0.62;
  const top = base - h;
  poly([[cx - w / 2, base], [cx - w * 0.36, top + 24 * S], [cx + w * 0.36, top + 24 * S], [cx + w / 2, base]], "#2a0c08");
  R(cx - w * 0.3, top + 6 * S, w * 0.6, 20 * S, "#2a0c08");
  ellipse(cx, top + 6 * S, w * 0.3, 6 * S, "#3a120a");
  // glowing seams
  const glow = 0.6 + 0.4 * Math.sin(t * 1.6);
  for (let k = 0; k < 6; k++) {
    const y = top + 30 * S + k * (h - 40 * S) / 6;
    ctx.globalAlpha = 0.35 + 0.35 * glow;
    R(cx - w * 0.34 + k * 1.5 * S, y, w * 0.68 - k * 3 * S, S, "#ff8a1a");
  }
  ctx.globalAlpha = 1;
  // the heart of the CORE
  const r = (9 + glow * 3) * S;
  ctx.globalAlpha = 0.25 * glow;
  ellipse(cx, top + 50 * S, r * 2.4, r * 2.4, "#ff6a00");
  ctx.globalAlpha = 1;
  ellipse(cx, top + 50 * S, r, r, "#ffb03a");
  ellipse(cx, top + 50 * S, r * 0.55, r * 0.55, "#fff2b0");
  // the beam it sends up into the sky
  ctx.globalAlpha = 0.18 + 0.1 * glow;
  R(cx - 2 * S, 0, 4 * S, top + 6 * S, "#ffb03a");
  ctx.globalAlpha = 1;
}

let last = performance.now(), t = 0;
function frame(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)) * opts.speed;
  last = Math.max(last, now);
  t += dt;

  // hot red sky
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#2a0604");
  sky.addColorStop(0.55, "#7a1a08");
  sky.addColorStop(1, "#c8420e");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  const ground = Math.round(H * 0.74);
  // far rock spires
  for (let x = 0; x < W; x += 2) {
    const h = H * 0.18 + Math.abs(Math.sin(x * 0.045)) * H * 0.16 + Math.sin(x * 0.13) * H * 0.03;
    R(x, ground - h, 2, h, "#4a1206");
  }
  core(W / 2, ground, t);

  // pipes running across the cliff face
  for (let k = 0; k < 2; k++) {
    const y = ground - (18 + k * 16) * S;
    R(0, y, W, 5 * S, "#5a2a1a");
    R(0, y, W, S, "#8a4a2a");
    for (let x = (k * 40) % 60; x < W; x += 60 * S) R(x, y - S, 4 * S, 7 * S, "#7a3a20");
  }

  // the ground: red rock with orange cracks
  R(0, ground, W, H - ground, "#5a1608");
  for (let x = 0; x < W; x += 9 * S) {
    const y = ground + 4 * S + (x * 7) % (H - ground - 8 * S);
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t * 2 + x);
    R(x, y, 6 * S, S, "#ff7a1a");
    ctx.globalAlpha = 1;
  }
  // a river of magma in front
  const my = Math.round(H * 0.88);
  for (let x = 0; x < W; x++) {
    const wave = Math.sin(x * 0.06 + t * 1.5) * 1.5 * S;
    R(x, my + wave, 1, H - my, "#ff5a00");
    R(x, my + wave, 1, 2 * S, "#ffd24a");
  }
  for (let k = 0; k < 8; k++) {   // bubbles in the magma
    const bx = (k * 97 + t * 8) % W, ph = (t * 1.3 + k) % 2;
    if (ph < 1) ellipse(bx, my + 6 * S - ph * 3 * S, (1 + ph * 2) * S, (1 + ph * 2) * S, "#ffb03a");
  }

  // steam vents: they puff every couple of seconds
  for (const v of vents) {
    R(v.x - 5 * S, ground - 4 * S, 10 * S, 4 * S, "#3a0c06");
    R(v.x - 3 * S, ground - 5 * S, 6 * S, S, "#2a0804");
    v.t -= dt;
    if (opts.steam && v.t <= 0) {
      v.t = rnd(2, 4);
      for (let i = 0; i < 14; i++) steam.push({ x: v.x + rnd(-2, 2) * S, y: ground - 5 * S, vy: -rnd(30, 60) * S, vx: rnd(-6, 6) * S, life: rnd(1, 2), max: 2 });
    }
  }
  for (const p of steam) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy *= 0.97; p.life -= dt;
    ctx.globalAlpha = Math.max(0, p.life / p.max) * 0.7;
    ellipse(p.x, p.y, (2 + (p.max - p.life) * 3) * S, (2 + (p.max - p.life) * 3) * S, "#ffe8d8");
  }
  ctx.globalAlpha = 1;
  steam = steam.filter((p) => p.life > 0);

  // embers drifting up
  for (const e of embers) {
    e.y -= e.v * dt;
    e.x += Math.sin(t * 2 + e.p) * 6 * dt;
    if (e.y < -2) Object.assign(e, newEmber(false));
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t * 6 + e.p);
    R(e.x, e.y, 1, 1, "#ffb03a");
  }
  ctx.globalAlpha = 1;

  // heat shimmer at the bottom
  ctx.globalAlpha = 0.08;
  for (let y = my - 20 * S; y < my; y += 3) R(Math.sin(t * 4 + y) * 2, y, W, 1, "#ffd24a");
  ctx.globalAlpha = 1;

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function livelyPropertyListener(name, val) {
  if (name in opts) opts[name] = val;
}
</script>
</body>
</html>
