[Rainmeter]
Update=1000
Group=WinUx
AccurateText=1
LocalFont=#@#Fonts\VT323-Regular.ttf
LocalFont2=#@#Fonts\PressStart2P-Regular.ttf

[Metadata]
Name=WinUx Calendar
Author=WinUx
Information=This month in pixels. Today sits on your soul.
Version=1.0

[Variables]
@Include=#@#Variables.inc
BoxW=330
BoxH=292
TodayX=-100
TodayY=-100

@IncludeBox=#@#Box.inc

[ScriptCalendar]
Measure=Script
ScriptFile=#CURRENTPATH#Calendar.lua
; checks once a minute whether the day changed
UpdateDivider=60

[MeterMonth]
Meter=String
X=36
Y=32
FontFace=Press Start 2P
FontSize=11
FontColor=#Line#
Text=* MONTH
AntiAlias=0
DynamicVariables=1

[MeterToday]
; the red soul behind today's number
Meter=Shape
X=#TodayX#
Y=#TodayY#
Heart=3,0 | LineTo 9,0 | LineTo 9,3 | LineTo 12,3 | LineTo 12,0 | LineTo 18,0 | LineTo 18,3 | LineTo 21,3 | LineTo 21,9 | LineTo 18,9 | LineTo 18,12 | LineTo 15,12 | LineTo 15,15 | LineTo 12,15 | LineTo 12,18 | LineTo 9,18 | LineTo 9,15 | LineTo 6,15 | LineTo 6,12 | LineTo 3,12 | LineTo 3,9 | LineTo 0,9 | LineTo 0,3 | LineTo 3,3 | ClosePath 1
Shape=Path Heart | Fill Color #Soul# | StrokeWidth 0 | Scale 1.6,1.6,0,0
DynamicVariables=1

[StyleHead]
FontFace=Press Start 2P
FontSize=8
FontColor=#Muted#
StringAlign=Center
AntiAlias=0
Y=68
DynamicVariables=1

[StyleDay]
FontFace=VT323
FontSize=22
FontColor=#Line#
StringAlign=Center
AntiAlias=1
DynamicVariables=1

