[Rainmeter]
Update=1000
Group=WinUx
AccurateText=1
LocalFont=#@#Fonts\VT323-Regular.ttf
LocalFont2=#@#Fonts\PressStart2P-Regular.ttf

[Metadata]
Name=WinUx Clock
Author=WinUx
Information=Pixel clock in a Deltarune text box.
Version=1.0

[Variables]
@Include=#@#Variables.inc
BoxW=380
BoxH=140
HeartX=36
HeartY=113

@IncludeBox=#@#Box.inc
@IncludeHeart=#@#Heart.inc

[MeasureTime]
Measure=Time
Format=%#I:%M

[MeasureAmPm]
Measure=Time
Format=%p

[MeasureDate]
Measure=Time
Format=%A, %B %#d

[MeterTime]
Meter=String
MeasureName=MeasureTime
X=36
Y=38
FontFace=Press Start 2P
FontSize=34
FontColor=#Line#
AntiAlias=0
DynamicVariables=1

[MeterAmPm]
Meter=String
MeasureName=MeasureAmPm
X=12R
Y=24r
FontFace=Press Start 2P
FontSize=13
FontColor=#Accent#
AntiAlias=0
DynamicVariables=1

[MeterDate]
Meter=String
MeasureName=MeasureDate
X=68
Y=104
FontFace=VT323
FontSize=24
FontColor=#Line#
Text=* %1.
AntiAlias=1
DynamicVariables=1
