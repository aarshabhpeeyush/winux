[Rainmeter]
Update=33
Group=WinUx
AccurateText=1
LocalFont=#@#Fonts\VT323-Regular.ttf

[Metadata]
Name=WinUx Bullet Board
Author=WinUx
Information=A music visualizer inside a battle box. The bars are bones, and your soul bounces to the beat.
Version=1.0

[Variables]
@Include=#@#Variables.inc
BoxW=420
BoxH=200

@IncludeBox=#@#Box.inc

; ---------- what your PC is playing, split into 16 bands

[MeasureAudio]
Measure=Plugin
Plugin=AudioLevel
Port=Output
FFTSize=1024
FFTOverlap=512
FFTAttack=10
FFTDecay=180
Bands=16
FreqMin=40
FreqMax=14000
Sensitivity=40

[MeasureLevel]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=RMS
Channel=Avg

[MeasureBand0]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=0

