[Rainmeter]
Update=100
Group=WinUx
AccurateText=1
LocalFont=#@#Fonts\VT323-Regular.ttf
LocalFont2=#@#Fonts\PressStart2P-Regular.ttf

[Metadata]
Name=WinUx Save Point
Author=WinUx
Information=A glowing save point. Click it to save (it fills you with determination). LV = days your PC has been on.
Version=1.0

[Variables]
@Include=#@#Variables.inc
BoxW=480
BoxH=150
Say=* (The glow of your desktop fills you with determination.)
SayColor=255,255,255

@IncludeBox=#@#Box.inc

; ---------- measures

[MeasureUser]
Measure=SysInfo
SysInfoType=USER_NAME
UpdateDivider=-1
RegExpSubstitute=1
Substitute="^(.{0,10}).*$":"\1"

[MeasureUptime]
Measure=Uptime
Format="%3!i!:%2!02i!"
AddDaysToHours=1
UpdateDivider=10

[MeasureUptimeSeconds]
Measure=Uptime
SecondsValue=1
UpdateDivider=10

[MeasureLV]
Measure=Calc
Formula=Floor(MeasureUptimeSeconds / 86400) + 1
UpdateDivider=10

[MeasurePulse]
; makes the star breathe
Measure=Calc
Formula=(MeasurePulse + 1) % 40
[MeasureScale]
Measure=Calc
Formula=1 + Sin(MeasurePulse / 40 * 2 * PI) * 0.12

; ---------- meters

[MeterStar]
Meter=Shape
X=40
Y=36
Star=0,-26 | LineTo 6,-6 | LineTo 26,0 | LineTo 6,6 | LineTo 0,26 | LineTo -6,6 | LineTo -26,0 | LineTo -6,-6 | ClosePath 1
Shape=Path Star | Fill Color 255,230,0,255 | StrokeWidth 3 | Stroke Color 255,140,0,255 | Scale [MeasureScale],[MeasureScale] | Offset 32,32
Shape2=Ellipse 32,32,4 | Fill Color 255,255,255,200 | StrokeWidth 0
DynamicVariables=1
SolidColor=0,0,0,1
W=64
H=64
LeftMouseUpAction=[!CommandMeasure ScriptSave "Save()"]
ToolTipText=Save

[MeterHero]
Meter=String
MeasureName=MeasureUser
X=126
Y=34
FontFace=Press Start 2P
FontSize=11
FontColor=#Line#
StringCase=Upper
Text=%1
AntiAlias=0

[MeterLV]
Meter=String
MeasureName=MeasureLV
X=270
Y=34
FontFace=Press Start 2P
FontSize=11
FontColor=#Line#
Text=LV %1
AntiAlias=0

[MeterTime]
Meter=String
MeasureName=MeasureUptime
X=(#BoxW#-4)
Y=34
StringAlign=Right
FontFace=Press Start 2P
FontSize=11
FontColor=#Line#
Text=%1
AntiAlias=0

[MeterPlace]
Meter=String
X=126
Y=58
FontFace=VT323
FontSize=22
FontColor=#Muted#
Text=WinUx Desktop
AntiAlias=1

[MeterSay]
Meter=String
X=126
Y=86
W=350
H=60
ClipString=2
FontFace=VT323
FontSize=21
FontColor=#SayColor#
Text=#Say#
AntiAlias=1
DynamicVariables=1

[ScriptSave]
Measure=Script
ScriptFile=#CURRENTPATH#SavePoint.lua
UpdateDivider=1
