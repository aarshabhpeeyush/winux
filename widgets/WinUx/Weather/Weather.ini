[Rainmeter]
Update=1000
Group=WinUx
AccurateText=1
LocalFont=#@#Fonts\VT323-Regular.ttf
LocalFont2=#@#Fonts\PressStart2P-Regular.ttf

[Metadata]
Name=WinUx Weather
Author=WinUx
Information=The weather, as told by a [[Big Shot]]. Uses wttr.in (free, no account). Click for a new line.
Version=1.0

[Variables]
@Include=#@#Variables.inc
BoxW=620
BoxH=190
; Leave Location empty to find your city automatically, or write a city like London
Location=
; m = Celsius, u = Fahrenheit
Units=m
Pitch=* [[Loading]]... PLEASE HOLD FOR A [[Big Shot]].

@IncludeBox=#@#Box.inc

; ---------- weather from wttr.in, every 30 minutes

[MeasureWeb]
Measure=WebParser
URL=https://wttr.in/#Location#?format=%25C|%25t|%25l&#Units#
RegExp=(?siU)^(.*)\|(.*)\|(.*)$
UpdateRate=1800
CodePage=65001
FinishAction=[!UpdateMeasure MeasureCondition][!UpdateMeasure MeasureTemp][!UpdateMeasure MeasurePlace][!CommandMeasure ScriptWeather "Pick()"]
OnConnectErrorAction=[!SetVariable Pitch "* THE [[Cloud]] IS DOWN! NO WEATHER FOR [[Free]]!! (No internet?)"][!UpdateMeter MeterLine][!Redraw]

[MeasureCondition]
Measure=WebParser
URL=[MeasureWeb]
StringIndex=1

[MeasureTemp]
Measure=WebParser
URL=[MeasureWeb]
StringIndex=2
RegExpSubstitute=1
Substitute="^\+":""

[MeasurePlace]
Measure=WebParser
URL=[MeasureWeb]
StringIndex=3
RegExpSubstitute=1
Substitute=",.*$":""

[ScriptWeather]
Measure=Script
ScriptFile=#CURRENTPATH#Weather.lua
UpdateDivider=-1

; ---------- meters

[MeterSpamton]
Meter=Image
ImageName=#@#Images\spamton.png
X=34
Y=40
W=56
H=56
LeftMouseUpAction=[!CommandMeasure ScriptWeather "Pick()"]

[MeterTitle]
Meter=String
X=110
Y=26
FontFace=VT323
FontSize=22
FontColor=#Muted#
Text=* WEATHER
AntiAlias=1

[MeterPlace]
Meter=String
MeasureName=MeasurePlace
X=(#BoxW#-6)
Y=26
StringAlign=Right
FontFace=VT323
FontSize=20
FontColor=#Muted#
Text=%1
W=380
ClipString=1
AntiAlias=1

[MeterLine]
Meter=String
X=110
Y=56
W=500
H=130
ClipString=2
FontFace=VT323
FontSize=25
FontColor=#Line#
Text=#Pitch#
AntiAlias=1
DynamicVariables=1
InlineSetting=Color | 255,230,0,255
InlinePattern=\[\[[^\]]*\]\]
SolidColor=0,0,0,1
LeftMouseUpAction=[!CommandMeasure ScriptWeather "Pick()"]
