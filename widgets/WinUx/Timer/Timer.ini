[Rainmeter]
Update=1000
Group=WinUx
AccurateText=1
LocalFont=#@#Fonts\PressStart2P-Regular.ttf
LocalFont2=#@#Fonts\VT323-Regular.ttf

[Metadata]
Name=WinUx Focus Timer
Author=WinUx
Information=A focus timer as a battle. FIGHT = start, ACT = change length, MERCY = pause (twice = reset). Win, then take a break.
Version=1.0

[Variables]
@Include=#@#Variables.inc
BoxW=400
BoxH=190
; minutes for each ACT choice, and the break
Choices=25,45,15
BreakMinutes=5
Clock=25:00
Foe=TASK
Message=* A wild TASK appears! Press FIGHT.
BarColor=0,255,0
BarBack=110,10,20
HeartX=-100
HeartY=-100

@IncludeBox=#@#Box.inc

[ScriptTimer]
Measure=Script
ScriptFile=#CURRENTPATH#Timer.lua
MinValue=0
MaxValue=1

; ---------- meters

[MeterFoe]
Meter=String
X=36
Y=34
FontFace=Press Start 2P
FontSize=11
FontColor=#Line#
Text=#Foe#
AntiAlias=0
DynamicVariables=1

[MeterBar]
Meter=Bar
MeasureName=ScriptTimer
X=130
Y=34
W=110
H=14
BarColor=#BarColor#
SolidColor=#BarBack#
BarOrientation=Horizontal
DynamicVariables=1

[MeterClock]
Meter=String
X=(#BoxW#-4)
Y=28
StringAlign=Right
FontFace=Press Start 2P
FontSize=18
FontColor=#Line#
Text=#Clock#
AntiAlias=0
DynamicVariables=1

[MeterMessage]
Meter=String
X=36
Y=60
W=360
H=62
ClipString=2
FontFace=VT323
FontSize=22
FontColor=#Line#
Text=#Message#
AntiAlias=1
DynamicVariables=1

[StyleButton]
Y=136
W=104
H=34
FontFace=Press Start 2P
FontSize=11
FontColor=255,140,0
StringAlign=Center
AntiAlias=0
SolidColor=0,0,0,1
DynamicVariables=1

[MeterButtons]
; orange battle-button boxes
Meter=Shape
X=0
Y=0
Shape=Rectangle 30,128,112,36 | Fill Color 0,0,0,0 | StrokeWidth 2 | Stroke Color 255,140,0
Shape2=Rectangle 152,128,112,36 | Fill Color 0,0,0,0 | StrokeWidth 2 | Stroke Color 255,140,0
Shape3=Rectangle 274,128,112,36 | Fill Color 0,0,0,0 | StrokeWidth 2 | Stroke Color 255,140,0

[MeterFight]
Meter=String
MeterStyle=StyleButton
X=96
Text=FIGHT
LeftMouseUpAction=[!CommandMeasure ScriptTimer "Fight()"]
MouseOverAction=[!SetOption #CURRENTSECTION# FontColor 255,230,0][!SetVariable HeartX 36][!SetVariable HeartY 137][!UpdateMeter *][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# FontColor 255,140,0][!SetVariable HeartX -100][!UpdateMeter *][!Redraw]

[MeterAct]
Meter=String
MeterStyle=StyleButton
X=218
Text=ACT
LeftMouseUpAction=[!CommandMeasure ScriptTimer "Act()"]
MouseOverAction=[!SetOption #CURRENTSECTION# FontColor 255,230,0][!SetVariable HeartX 158][!SetVariable HeartY 137][!UpdateMeter *][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# FontColor 255,140,0][!SetVariable HeartX -100][!UpdateMeter *][!Redraw]

[MeterMercy]
Meter=String
MeterStyle=StyleButton
X=340
Text=MERCY
LeftMouseUpAction=[!CommandMeasure ScriptTimer "Mercy()"]
MouseOverAction=[!SetOption #CURRENTSECTION# FontColor 255,230,0][!SetVariable HeartX 280][!SetVariable HeartY 137][!UpdateMeter *][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# FontColor 255,140,0][!SetVariable HeartX -100][!UpdateMeter *][!Redraw]

@IncludeHeart=#@#Heart.inc
