[Rainmeter]
Update=1000
Group=WinUx
AccurateText=1
LocalFont=#@#Fonts\VT323-Regular.ttf
LocalFont2=#@#Fonts\PressStart2P-Regular.ttf

[Metadata]
Name=WinUx Stats
Author=WinUx
Information=CPU, RAM and disk as Deltarune-style HP bars.
Version=1.0

[Variables]
@Include=#@#Variables.inc
BoxW=360
BoxH=170
BarX=110
BarW=150

@IncludeBox=#@#Box.inc

; ---------- measures

[MeasureCPU]
Measure=CPU
Processor=0
MinValue=0
MaxValue=100

[MeasureRAM]
Measure=PhysicalMemory

[MeasureRAMTotal]
Measure=PhysicalMemory
Total=1

[MeasureRAMPct]
Measure=Calc
Formula=MeasureRAMTotal > 0 ? Round(MeasureRAM / MeasureRAMTotal * 100) : 0
MinValue=0
MaxValue=100

[MeasureDiskFree]
Measure=FreeDiskSpace
Drive=C:
UpdateDivider=30

[MeasureDiskTotal]
Measure=FreeDiskSpace
Drive=C:
Total=1
UpdateDivider=30

[MeasureDiskPct]
Measure=Calc
Formula=MeasureDiskTotal > 0 ? Round((1 - MeasureDiskFree / MeasureDiskTotal) * 100) : 0
MinValue=0
MaxValue=100
UpdateDivider=30

; ---------- styles

[StyleLabel]
X=36
FontFace=Press Start 2P
FontSize=11
FontColor=#Line#
AntiAlias=0

[StyleBarBack]
X=#BarX#
W=#BarW#
H=14
SolidColor=110,10,20,255
BarColor=#Accent#
BarOrientation=Horizontal
DynamicVariables=1

[StyleValue]
X=(#BarX#+#BarW#+12)
FontFace=VT323
FontSize=22
FontColor=#Line#
AntiAlias=1
DynamicVariables=1

; ---------- meters

[MeterTitle]
Meter=String
X=36
Y=30
FontFace=VT323
FontSize=24
FontColor=#Muted#
Text=* PC STATUS
AntiAlias=1

[MeterCPULabel]
Meter=String
MeterStyle=StyleLabel
Y=74
Text=CPU

[MeterCPUBar]
Meter=Bar
MeterStyle=StyleBarBack
MeasureName=MeasureCPU
Y=72

[MeterCPUValue]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureCPU
Y=63
Text=%1/100
NumOfDecimals=0

[MeterRAMLabel]
Meter=String
MeterStyle=StyleLabel
Y=106
Text=RAM

[MeterRAMBar]
Meter=Bar
MeterStyle=StyleBarBack
MeasureName=MeasureRAMPct
Y=104

[MeterRAMValue]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureRAMPct
Y=95
Text=%1/100

[MeterDiskLabel]
Meter=String
MeterStyle=StyleLabel
Y=138
Text=DISK

[MeterDiskBar]
Meter=Bar
MeterStyle=StyleBarBack
MeasureName=MeasureDiskPct
Y=136

[MeterDiskValue]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureDiskPct
Y=127
Text=%1/100
