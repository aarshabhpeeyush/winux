[Rainmeter]
Update=1000
Group=WinUx
AccurateText=1
LocalFont=#@#Fonts\VT323-Regular.ttf
LocalFont2=#@#Fonts\PressStart2P-Regular.ttf

[Metadata]
Name=WinUx Battery
Author=WinUx
Information=Your battery as your HP bar (with your Windows name). Goes red and shakes when it's low, heals when you plug in.
Version=1.0

[Variables]
@Include=#@#Variables.inc
BoxW=410
BoxH=110
Shake=0
BarColor=255,230,0
Note=* Battery is fine.

@IncludeBox=#@#Box.inc

; ---------- measures

[MeasureUser]
; your Windows user name, like a party member (first 8 letters)
Measure=SysInfo
SysInfoType=USER_NAME
UpdateDivider=-1
RegExpSubstitute=1
Substitute="^(.{0,8}).*$":"\1"

[MeasurePercent]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Percent
MinValue=0
MaxValue=100

[MeasurePlugged]
Measure=Plugin
Plugin=PowerPlugin
PowerState=ACLine

[MeasureStatus]
; 0 = no battery, 1 = charging, 2 = critical, 3 = low, 4 = high
Measure=Plugin
Plugin=PowerPlugin
PowerState=Status

[MeasureMood]
; 0 = desktop PC, 1 = charging, 2 = low, 3 = fine
Measure=Calc
Formula=MeasureStatus = 0 ? 0 : (MeasurePlugged = 1 ? 1 : (MeasurePercent <= 20 ? 2 : 3))
IfCondition=MeasureMood = 0
IfTrueAction=[!SetVariable BarColor "255,230,0"][!SetVariable Note "* No battery. HP is infinite."][!SetVariable Shake 0][!HideMeter MeterHPValue][!ShowMeter MeterInfinity]
IfCondition2=MeasureMood = 1
IfTrueAction2=[!SetVariable BarColor "0,255,0"][!SetVariable Note "* You're plugged in. HP is healing!"][!SetVariable Shake 0][!ShowMeter MeterHPValue][!HideMeter MeterInfinity]
IfCondition3=MeasureMood = 2
IfTrueAction3=[!SetVariable BarColor "255,26,26"][!SetVariable Note "* HP is low! Find a charger!!"][!SetVariable Shake 1][!ShowMeter MeterHPValue][!HideMeter MeterInfinity]
IfCondition4=MeasureMood = 3
IfTrueAction4=[!SetVariable BarColor "#Accent#"][!SetVariable Note "* You're filled with battery."][!SetVariable Shake 0][!ShowMeter MeterHPValue][!HideMeter MeterInfinity]
DynamicVariables=1

[MeasureJitter]
; a little shake when HP is low, like taking damage
Measure=Calc
Formula=#Shake# * Random
LowBound=-2
HighBound=2
UpdateRandom=1
DynamicVariables=1

[MeasureHP]
Measure=Calc
Formula=MeasureStatus = 0 ? 100 : MeasurePercent
MinValue=0
MaxValue=100

; ---------- meters

[MeterName]
Meter=String
MeasureName=MeasureUser
X=(34 + [MeasureJitter])
Y=34
FontFace=Press Start 2P
FontSize=13
FontColor=#Line#
StringCase=Upper
Text=%1
AntiAlias=0
DynamicVariables=1

[MeterHPLabel]
Meter=String
X=14R
Y=36
FontFace=Press Start 2P
FontSize=9
FontColor=#Line#
Text=HP
AntiAlias=0
DynamicVariables=1

[MeterBar]
Meter=Bar
MeasureName=MeasureHP
X=8R
Y=34
W=100
H=16
BarColor=#BarColor#
SolidColor=110,10,20,255
BarOrientation=Horizontal
DynamicVariables=1

[MeterHPValue]
Meter=String
MeasureName=MeasureHP
X=10R
Y=27
FontFace=VT323
FontSize=22
FontColor=#Line#
Text=%1
NumOfDecimals=0
AntiAlias=1
DynamicVariables=1

[MeterInfinity]
; desktops have no battery, so their HP is infinite
Meter=Shape
X=([MeterBar:X] + 110)
Y=34
Shape=Ellipse 7,8,7,6 | Fill Color 0,0,0,0 | StrokeWidth 3 | Stroke Color #Line#
Shape2=Ellipse 21,8,7,6 | Fill Color 0,0,0,0 | StrokeWidth 3 | Stroke Color #Line#
Hidden=1
DynamicVariables=1

[MeterNote]
Meter=String
X=34
Y=66
W=375
ClipString=1
FontFace=VT323
FontSize=23
FontColor=#Line#
Text=#Note#
AntiAlias=1
DynamicVariables=1
