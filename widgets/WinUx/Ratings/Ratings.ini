[Rainmeter]
Update=1000
Group=WinUx
AccurateText=1
LocalFont=#@#Fonts\VT323-Regular.ttf
LocalFont2=#@#Fonts\PressStart2P-Regular.ttf

[Metadata]
Name=WinUx Ratings
Author=WinUx
Information=Your internet speed as Mettaton's TV ratings. OH YES!
Version=1.0

[Variables]
@Include=#@#Variables.inc
BoxW=470
BoxH=190
Pink=255,62,165
Quip=* Lights... camera...

@IncludeBox=#@#Box.inc

; ---------- internet speed (bytes per second)

[MeasureDown]
Measure=NetIn
Interface=Best

[MeasureUp]
Measure=NetOut
Interface=Best

[MeasureTier]
; how exciting are the ratings right now?
Measure=Calc
Formula=MeasureDown < 50000 ? 0 : (MeasureDown < 1000000 ? 1 : (MeasureDown < 10000000 ? 2 : 3))
IfCondition=MeasureTier = 0
IfTrueAction=[!SetVariable Quip "* Ratings are flat. Do SOMETHING!"]
IfCondition2=MeasureTier = 1
IfTrueAction2=[!SetVariable Quip "* The audience is warming up!"]
IfCondition3=MeasureTier = 2
IfTrueAction3=[!SetVariable Quip "* OOOH YES! Ratings are SOARING!"]
IfCondition4=MeasureTier = 3
IfTrueAction4=[!SetVariable Quip "* A STAR IS BORN!! RECORD RATINGS!"]

; ---------- meters

[MeterTitle]
Meter=String
X=36
Y=30
FontFace=Press Start 2P
FontSize=10
FontColor=#Pink#
Text=* METTATON RATINGS *
AntiAlias=0

[MeterChartBack]
Meter=Shape
X=36
Y=56
Shape=Rectangle 0,0,400,62 | Fill Color 40,0,24,255 | StrokeWidth 1 | Stroke Color #Pink#
Shape2=Line 0,31,400,31 | StrokeWidth 1 | Stroke Color 255,62,165,50

[MeterChart]
; the ratings chart: download speed over the last ~2 minutes
Meter=Line
MeasureName=MeasureDown
X=37
Y=57
W=398
H=60
LineCount=1
LineColor=#Pink#
LineWidth=2
AutoScale=1
AntiAlias=1

[MeterDown]
Meter=String
MeasureName=MeasureDown
X=36
Y=124
FontFace=VT323
FontSize=21
FontColor=#Line#
AutoScale=1
NumOfDecimals=1
Text=IN: %1B/s
AntiAlias=1

[MeterUp]
Meter=String
MeasureName=MeasureUp
X=436
Y=124
StringAlign=Right
FontFace=VT323
FontSize=21
FontColor=#Muted#
AutoScale=1
NumOfDecimals=1
Text=OUT: %1B/s
AntiAlias=1

[MeterQuip]
Meter=String
X=36
Y=150
W=420
ClipString=1
FontFace=VT323
FontSize=22
FontColor=#Pink#
Text=#Quip#
AntiAlias=1
DynamicVariables=1
