[Rainmeter]
Update=1000
Group=WinUx
AccurateText=1
LocalFont=#@#Fonts\VT323-Regular.ttf
LocalFont2=#@#Fonts\PressStart2P-Regular.ttf

[Metadata]
Name=WinUx Party
Author=WinUx
Information=Your PC as a Deltarune party. Kris = CPU, Susie = RAM, Ralsei = disk. HP is what's free, so a busy PC takes damage.
Version=1.0

[Variables]
@Include=#@#Variables.inc
BoxW=720
BoxH=112

@IncludeBox=#@#Box.inc

; ---------- measures: HP = how much is FREE (busy PC = taking damage)

[MeasureCPU]
Measure=CPU
Processor=0

[MeasureCPUHP]
Measure=Calc
Formula=Round(100 - MeasureCPU)
MinValue=0
MaxValue=100

[MeasureRAM]
Measure=PhysicalMemory

[MeasureRAMTotal]
Measure=PhysicalMemory
Total=1

[MeasureRAMHP]
Measure=Calc
Formula=MeasureRAMTotal > 0 ? Round(100 - MeasureRAM / MeasureRAMTotal * 100) : 100
MinValue=0
MaxValue=100

[MeasureDiskFree]
Measure=FreeDiskSpace
Drive=C:
UpdateDivider=30

[MeasureDiskTotal]
Measure=FreeDiskSpace
Drive=C:
Total=1
UpdateDivider=30

[MeasureDiskHP]
Measure=Calc
Formula=MeasureDiskTotal > 0 ? Round(MeasureDiskFree / MeasureDiskTotal * 100) : 100
MinValue=0
MaxValue=100
UpdateDivider=30

; ---------- styles

[StyleName]
FontFace=Press Start 2P
FontSize=10
FontColor=#Line#
AntiAlias=0
DynamicVariables=1

[StyleHP]
FontFace=Press Start 2P
FontSize=7
FontColor=#Line#
AntiAlias=0

[StyleValue]
FontFace=VT323
FontSize=20
FontColor=#Line#
AntiAlias=1
DynamicVariables=1

[StyleWhat]
FontFace=VT323
FontSize=17
FontColor=#Muted#
AntiAlias=1

; ---------- KRIS = CPU

[MeterKRISFace]
Meter=Image
ImageName=#@#Images\kris.png
X=30
Y=32

[MeterKRISName]
Meter=String
MeterStyle=StyleName
X=94
Y=34
Text=KRIS

[MeterKRISDown]
; knocked down when there's almost nothing free
Meter=String
MeterStyle=StyleWhat
X=180
Y=28
FontColor=255,26,26
Text=DOWN
Hidden=1

[MeasureKRISMood]
Measure=Calc
Formula=MeasureCPUHP
IfCondition=MeasureCPUHP < 10
IfTrueAction=[!ShowMeter MeterKRISDown][!SetOption MeterKRISName FontColor 255,26,26][!UpdateMeter *][!Redraw]
IfFalseAction=[!HideMeter MeterKRISDown][!SetOption MeterKRISName FontColor #Line#][!UpdateMeter *][!Redraw]

[MeterKRISHP]
Meter=String
MeterStyle=StyleHP
X=94
Y=64
Text=HP

[MeterKRISBar]
Meter=Bar
MeasureName=MeasureCPUHP
X=118
Y=62
W=66
H=12
BarColor=0,200,255
SolidColor=110,10,20,255
BarOrientation=Horizontal

[MeterKRISValue]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureCPUHP
X=190
Y=54
Text=%1/100

[MeterKRISWhat]
Meter=String
MeterStyle=StyleWhat
X=94
Y=82
Text=CPU free

