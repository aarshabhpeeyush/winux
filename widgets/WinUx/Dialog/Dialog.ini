[Rainmeter]
Update=1000
Group=WinUx
AccurateText=1
LocalFont=#@#Fonts\VT323-Regular.ttf

[Metadata]
Name=WinUx Dialog
Author=WinUx
Information=A Deltarune-style text box that says something new every 10 minutes. Click it for a new line.
Version=1.0

[Variables]
@Include=#@#Variables.inc
BoxW=560
BoxH=112

@IncludeBox=#@#Box.inc

[MeasurePick]
Measure=Calc
Formula=Random
LowBound=1
HighBound=14
UpdateRandom=1
UpdateDivider=600
; line 12 is Gaster's, so it's written in Wingdings
IfCondition=MeasurePick = 12
IfTrueAction=[!SetOption MeterText FontFace "Wingdings"][!SetOption MeterText FontSize 20][!UpdateMeter MeterText][!Redraw]
IfFalseAction=[!SetOption MeterText FontFace "VT323"][!SetOption MeterText FontSize 26][!UpdateMeter MeterText][!Redraw]

[MeasureLine]
Measure=Calc
Formula=MeasurePick
RegExpSubstitute=1
Substitute="^1$":"The desktop hums quietly. It's full of possibilities.","^2$":"You feel like customizing something.","^3$":"A cold breeze blows through the taskbar.","^4$":"The wallpaper looks back at you. It seems friendly.","^5$":"(It's a computer. It's YOUR computer.)","^6$":"You remembered to save. Probably.","^7$":"The fan spins with determination.","^8$":"Somewhere, a file is waiting to be opened.","^9$":"Your apps line up, ready for adventure.","^10$":"It's quiet... maybe it's time for music.","^11$":"The pixels twinkle. You feel at home.","^12$":"Dark, darker, yet darker.","^13$":"The clock ticks on. So does your to-do list.","^14$":"You are filled with WinUx."
DynamicVariables=1

[MeterStar]
Meter=String
X=36
Y=36
FontFace=VT323
FontSize=26
FontColor=#Line#
Text=*
AntiAlias=1

[MeterText]
Meter=String
MeasureName=MeasureLine
X=62
Y=36
W=490
H=80
ClipString=1
FontFace=VT323
FontSize=26
FontColor=#Line#
AntiAlias=1
DynamicVariables=1
SolidColor=0,0,0,1
LeftMouseUpAction=[!UpdateMeasure MeasurePick][!UpdateMeasure MeasureLine][!UpdateMeter MeterText][!Redraw]
MouseOverAction=[!SetOption MeterText FontColor #Accent#][!UpdateMeter MeterText][!Redraw]
MouseLeaveAction=[!SetOption MeterText FontColor #Line#][!UpdateMeter MeterText][!Redraw]
