[Rainmeter]
Update=1000
Group=WinUx
AccurateText=1
LocalFont=#@#Fonts\VT323-Regular.ttf
LocalFont2=#@#Fonts\PressStart2P-Regular.ttf

[Metadata]
Name=WinUx Music
Author=WinUx
Information=Shows what Spotify is playing, with play/pause and skip buttons.
Version=1.1

[Variables]
@Include=#@#Variables.inc
BoxW=400
BoxH=150
HeartX=36
HeartY=36

@IncludeBox=#@#Box.inc
@IncludeHeart=#@#Heart.inc

; ---------- reading Spotify
; Rainmeter's built-in NowPlaying reader. (An older version ran a Windows
; command every few seconds instead, and that froze Rainmeter.)

[MeasurePlayer]
Measure=NowPlaying
PlayerName=Spotify
PlayerType=TITLE
Substitute="":"Nothing playing."

[MeasureArtist]
Measure=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=ARTIST

[MeasureState]
Measure=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=STATE
IfCondition=MeasureState = 1
IfTrueAction=[!SetOption MeterPlay Text "||"][!UpdateMeter MeterPlay][!Redraw]
IfFalseAction=[!SetOption MeterPlay Text ">"][!UpdateMeter MeterPlay][!Redraw]

; ---------- meters

[MeterTitle]
Meter=String
X=68
Y=30
FontFace=VT323
FontSize=24
FontColor=#Muted#
Text=* NOW PLAYING
AntiAlias=1

[MeterSong]
Meter=String
MeasureName=MeasurePlayer
X=36
Y=66
W=350
H=34
ClipString=1
FontFace=VT323
FontSize=30
FontColor=#Line#
AntiAlias=1
DynamicVariables=1

[MeterArtist]
Meter=String
MeasureName=MeasureArtist
X=36
Y=100
W=230
H=28
ClipString=1
FontFace=VT323
FontSize=22
FontColor=#Accent#
AntiAlias=1
DynamicVariables=1

[StyleButton]
Y=110
W=26
StringAlign=Center
FontFace=Press Start 2P
FontSize=12
FontColor=#Line#
AntiAlias=0
SolidColor=0,0,0,1
Padding=4,4,4,4
DynamicVariables=1
MouseOverAction=[!SetOption #CURRENTSECTION# FontColor #Accent#][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# FontColor #Line#][!UpdateMeter #CURRENTSECTION#][!Redraw]

[MeterPrev]
Meter=String
MeterStyle=StyleButton
X=300
Text=<<
LeftMouseUpAction=[!CommandMeasure MeasurePlayer "Previous"]

[MeterPlay]
Meter=String
MeterStyle=StyleButton
X=338
Text=>
LeftMouseUpAction=[!CommandMeasure MeasurePlayer "PlayPause"]

[MeterNext]
Meter=String
MeterStyle=StyleButton
X=376
Text=>>
LeftMouseUpAction=[!CommandMeasure MeasurePlayer "Next"]
