[Rainmeter]
Update=1000
Group=WinUx
AccurateText=1
LocalFont=#@#Fonts\PressStart2P-Regular.ttf
LocalFont2=#@#Fonts\VT323-Regular.ttf

[Metadata]
Name=WinUx Menu
Author=WinUx
Information=A Deltarune-style launcher. The soul follows your mouse.
Version=1.0

[Variables]
@Include=#@#Variables.inc
BoxW=250
BoxH=236
HeartX=34
HeartY=-100

@IncludeBox=#@#Box.inc
@IncludeHeart=#@#Heart.inc

[StyleItem]
X=70
FontFace=Press Start 2P
FontSize=13
FontColor=#Line#
AntiAlias=0
SolidColor=0,0,0,1
W=160
H=26
DynamicVariables=1
MouseOverAction=[!SetOption #CURRENTSECTION# FontColor #Accent#][!SetVariable HeartY ([#CURRENTSECTION#:Y]-1)][!UpdateMeter *][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# FontColor #Line#][!SetVariable HeartY -100][!UpdateMeter *][!Redraw]

[MeterTitle]
Meter=String
X=36
Y=28
FontFace=VT323
FontSize=24
FontColor=#Muted#
Text=* MENU
AntiAlias=1

[MeterFiles]
Meter=String
MeterStyle=StyleItem
Y=66
Text=FILES
LeftMouseUpAction=["explorer.exe"]

[MeterYouTube]
Meter=String
MeterStyle=StyleItem
Y=100
Text=YOUTUBE
LeftMouseUpAction=["https://www.youtube.com"]

[MeterSpotify]
Meter=String
MeterStyle=StyleItem
Y=134
Text=SPOTIFY
LeftMouseUpAction=["spotify:"]

[MeterDiscord]
Meter=String
MeterStyle=StyleItem
Y=168
Text=DISCORD
LeftMouseUpAction=["discord://"]

[MeterWinUx]
Meter=String
MeterStyle=StyleItem
Y=202
Text=WINUX
LeftMouseUpAction=["#WinUxDir#\Start WinUx.bat"]
