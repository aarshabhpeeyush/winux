[Rainmeter]
Update=100
Group=WinUx
AccurateText=1
LocalFont=#@#Fonts\VT323-Regular.ttf
; the dog walks by itself, so don't let it be dragged around
OnRefreshAction=[!Draggable 0][!KeepOnScreen 0]

[Metadata]
Name=WinUx Annoying Dog
Author=WinUx
Information=The Annoying Dog wanders along the bottom of your screen and naps. Click it.
Version=1.0

[Variables]
@Include=#@#Variables.inc
Frame=dog-walk1
Flip=None
Say=

[ScriptDog]
Measure=Script
ScriptFile=#CURRENTPATH#Dog.lua

[MeterSay]
; "Bark!" and "Z z" bubbles
Meter=String
X=25
Y=0
StringAlign=Center
FontFace=VT323
FontSize=18
FontColor=#Line#
Text=#Say#
AntiAlias=1
DynamicVariables=1

[MeterDog]
Meter=Image
ImageName=#@#Images\#Frame#.png
ImageFlip=#Flip#
X=0
Y=20
SolidColor=0,0,0,1
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure ScriptDog "Pet()"]
